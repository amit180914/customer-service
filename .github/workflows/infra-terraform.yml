name: Infra Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform
    env:
      TF_IN_AUTOMATION: true
      BOOTSTRAP_CREDENTIALS: ${{ secrets.GCP_BOOTSTRAP_CREDENTIALS }}
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GAR_LOCATION != '' && vars.GAR_LOCATION || 'us-central1' }}
      TF_VAR_gke_cluster_name: ${{ secrets.GKE_CLUSTER_NAME != '' && secrets.GKE_CLUSTER_NAME || vars.GKE_CLUSTER_NAME || 'java-app-gke' }}
      TF_VAR_gar_repository: ${{ vars.GAR_REPOSITORY != '' && vars.GAR_REPOSITORY || 'java-services' }}
      TF_VAR_k8s_namespace: ${{ vars.K8S_NAMESPACE != '' && vars.K8S_NAMESPACE || 'amit' }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET != '' && secrets.TF_STATE_BUCKET || vars.TF_STATE_BUCKET }}
      TF_STATE_PREFIX: ${{ vars.TF_STATE_PREFIX != '' && vars.TF_STATE_PREFIX || 'customer-service' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required inputs
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER != '' && secrets.WIF_PROVIDER || vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT != '' && secrets.WIF_SERVICE_ACCOUNT || vars.WIF_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$TF_VAR_project_id" ]; then
            echo "::error::Missing GCP project id. Set GCP_PROJECT_ID as a secret or variable."
            exit 1
          fi
          if [ -z "$TF_STATE_BUCKET" ]; then
            echo "::error::Missing Terraform state bucket. Set TF_STATE_BUCKET as a secret or variable."
            exit 1
          fi
          if [ -z "$BOOTSTRAP_CREDENTIALS" ] && ([ -z "$WIF_PROVIDER" ] || [ -z "$WIF_SERVICE_ACCOUNT" ]); then
            echo "::error::Configure auth via GCP_BOOTSTRAP_CREDENTIALS or WIF_PROVIDER + WIF_SERVICE_ACCOUNT."
            exit 1
          fi

      - name: Authenticate with bootstrap credentials
        if: ${{ env.BOOTSTRAP_CREDENTIALS != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ env.BOOTSTRAP_CREDENTIALS }}

      - name: Authenticate with WIF
        if: ${{ env.BOOTSTRAP_CREDENTIALS == '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER != '' && secrets.WIF_PROVIDER || vars.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT != '' && secrets.WIF_SERVICE_ACCOUNT || vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="prefix=${TF_STATE_PREFIX}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: ${{ github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply' }}
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -input=false -auto-approve tfplan

      - name: Terraform outputs
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform output

      - name: Terraform destroy
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform destroy -input=false -auto-approve

