name: Deploy Java App to GKE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE != '' && vars.K8S_NAMESPACE || 'amit' }}
  GAR_REPOSITORY: ${{ vars.GAR_REPOSITORY != '' && vars.GAR_REPOSITORY || 'java-services' }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION != '' && vars.GAR_LOCATION || 'us-central1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate auth inputs
        env:
          WIF_PROVIDER: ${{ secrets.WIF_PROVIDER != '' && secrets.WIF_PROVIDER || vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT != '' && secrets.WIF_SERVICE_ACCOUNT || vars.WIF_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}
          GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME != '' && secrets.GKE_CLUSTER_NAME || vars.GKE_CLUSTER_NAME }}
          GCP_APP_SA_EMAIL: ${{ secrets.GCP_APP_SA_EMAIL != '' && secrets.GCP_APP_SA_EMAIL || vars.GCP_APP_SA_EMAIL }}
        run: |
          if [ -z "$WIF_PROVIDER" ]; then
            echo "::error::Missing WIF provider. Set WIF_PROVIDER as a repository secret or variable."
            exit 1
          fi
          if [ -z "$WIF_SERVICE_ACCOUNT" ]; then
            echo "::error::Missing WIF service account. Set WIF_SERVICE_ACCOUNT as a repository secret or variable."
            exit 1
          fi
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::Missing GCP project id. Set GCP_PROJECT_ID as a repository/environment secret or variable."
            exit 1
          fi
          if [ -z "$GKE_CLUSTER_NAME" ]; then
            echo "::error::Missing GKE cluster name. Set GKE_CLUSTER_NAME as a repository/environment secret or variable."
            exit 1
          fi
          if [ -z "$GCP_APP_SA_EMAIL" ]; then
            echo "::error::Missing app service account email. Set GCP_APP_SA_EMAIL as a repository/environment secret or variable."
            exit 1
          fi

      - name: Auth to GCP
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER != '' && secrets.WIF_PROVIDER || vars.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT != '' && secrets.WIF_SERVICE_ACCOUNT || vars.WIF_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify target Artifact Registry repository
        env:
          EXPECTED_SA: ${{ secrets.WIF_SERVICE_ACCOUNT != '' && secrets.WIF_SERVICE_ACCOUNT || vars.WIF_SERVICE_ACCOUNT }}
        run: |
          ACTIVE_ACCOUNT="$(gcloud config get-value account)"
          echo "Active account: ${ACTIVE_ACCOUNT}"
          if [ "${ACTIVE_ACCOUNT}" != "${EXPECTED_SA}" ]; then
            echo "::error::Authenticated account (${ACTIVE_ACCOUNT}) does not match WIF service account (${EXPECTED_SA})."
            exit 1
          fi
          gcloud artifacts repositories describe "${{ env.GAR_REPOSITORY }}" \
            --location "${{ env.GAR_LOCATION }}" \
            --project "${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}"

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push image
        run: |
          IMAGE="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/java-app:${{ github.sha }}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials "${{ secrets.GKE_CLUSTER_NAME != '' && secrets.GKE_CLUSTER_NAME || vars.GKE_CLUSTER_NAME }}" \
            --region "${{ env.GAR_LOCATION }}" \
            --project "${{ secrets.GCP_PROJECT_ID != '' && secrets.GCP_PROJECT_ID || vars.GCP_PROJECT_ID }}"

      - name: Render manifests
        run: |
          sed "s|__IMAGE__|${IMAGE}|g" k8s/deployment.yml > k8s/deployment.rendered.yaml
          sed "s|__GCP_APP_SA_EMAIL__|${{ secrets.GCP_APP_SA_EMAIL != '' && secrets.GCP_APP_SA_EMAIL || vars.GCP_APP_SA_EMAIL }}|g" k8s/serviceaccount.yml > k8s/serviceaccount.rendered.yaml

      - name: Deploy
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/serviceaccount.rendered.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/deployment.rendered.yaml
          kubectl rollout status deployment/java-app -n "${{ env.K8S_NAMESPACE }}" --timeout=300s

      - name: Service endpoint
        run: kubectl get svc java-app -n "${{ env.K8S_NAMESPACE }}"

