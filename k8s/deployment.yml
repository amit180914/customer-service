apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app
  namespace: amit
  labels:
    app: java-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      serviceAccountName: app-sa
      containers:
        - name: java-app
          image: __IMAGE__
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

